<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AMENOWA</title>
  </head>

  <body>
    <main class="l-main l-main--front">
      <!-- MV -->
      <section class="p-mv">
        <div class="p-mv__inner">
          <header class="p-mv__header">
            <div class="p-mv__logo-wrap">
              <div class="p-mv__logo">
                <a href="/">
                  <img src="/assets/images/header_logo.svg" alt="AMENOWA" />
                </a>
              </div>
              <span class="p-mv__logo-title">AMENOWA</span>
            </div>

            <button
              class="p-mv__hamburger js-hamburger"
              type="button"
              aria-label="メニューを開く"
              aria-expanded="false"
            >
              <span></span>
              <span></span>
              <span></span>
            </button>
          </header>

          <div
            id="drawer-menu"
            class="p-mv__drawer js-drawer"
            aria-hidden="true"
          >
            <button
              class="p-mv__drawer-close js-drawer-close"
              type="button"
              aria-label="メニューを閉じる"
            >
              <span></span>
              <span></span>
            </button>
            <nav class="p-mv__drawer-nav">
              <ul class="p-mv__drawer-list">
                <li>
                  <a href="#about">ABOUT AMENOWA</a>
                </li>

                <li>
                  <a href="#service">SERVICE</a>
                </li>

                <li>
                  <a href="#commerce">LIVE COMMERCE</a>
                </li>

                <li>
                  <a href="#crowdfunding">CROWD FUNDING</a>
                </li>

                <li>
                  <a href="#producers">PRODUCERS</a>
                </li>

                <li>
                  <a href="#news">NEWS</a>
                </li>
              </ul>
            </nav>
            <div class="p-mv__drawer-sns">
              <a href="#" aria-label="TikTok">
                <img src="/assets/images/tiktok.svg" alt="TikTok" />
              </a>
              <a href="#" aria-label="Instagram">
                <img src="/assets/images/instagram.svg" alt="Instagram" />
              </a>
              <a href="#" aria-label="Threads">
                <img src="/assets/images/threds.svg" alt="Threads" />
              </a>
            </div>
          </div>

          <div class="p-mv__copy">
            <p class="p-mv__copy-line">
              <span>素のまま</span>
            </p>

            <p class="p-mv__copy-line">
              <span>ひかり</span>
            </p>

            <p class="p-mv__copy-line">
              <span>めぐり</span>
            </p>

            <p class="p-mv__copy-line">
              <span>むすぶ。</span>
            </p>
          </div>

          <div class="p-mv__main-image">
            <img src="/assets/images/main_potato.svg" alt="" />
          </div>

          <p class="p-mv__lead">
            ひとつひとつの<br />
            輝きをありのまま届け<br />
            愛を繋げる。
          </p>

          <div class="p-mv__sub-image p-mv__sub-image--left">
            <img src="/assets/images/main_live.svg" alt="" />
          </div>

          <div class="p-mv__sub-image p-mv__sub-image--right">
            <img src="/assets/images/main_boy.svg" alt="" />
          </div>

          <div class="p-mv__deco p-mv__deco--brush">
            <img src="/assets/images/deco_green_lawn.svg" alt="" />
          </div>

          <div class="p-mv__deco p-mv__deco--star">
            <img src="/assets/images/deco_star.svg" alt="" />
          </div>

          <div class="p-mv__deco p-mv__deco--pink">
            <img src="/assets/images/deco_pink.svg" alt="" />
          </div>
          <div class="p-mv__scroll">
            <span>scroll</span>
          </div>

          <div class="p-mv__news">
            <span class="p-mv__news-label"> NEWS </span>

            <time class="p-mv__news-date"> 2026.06.11 </time>

            <p class="p-mv__news-title">クラウドファンディング応援者...</p>

            <span class="p-mv__news-arrow"> → </span>
          </div>
        </div>
      </section>

      <!-- ABOUT -->
      <section class="p-about">
        <div class="p-about__inner">
          <p class="p-about__label">ABOUT AMENOWA</p>

          <h2 class="p-about__title">
            素にかえる、<br />
            愛がめぐる。
          </h2>

          <div class="p-about__body">
            <p class="p-about__text">
              人はきっと、<br />
              ありのままでいる時が<br />
              いちばん美しい。
            </p>

            <p class="p-about__text">
              AMENOWA は、<br />
              その人らしさに<br />
              そっと光をあてます。
            </p>
          </div>

          <div class="p-about__decoration"></div>

          <span class="p-about__scroll"> scroll </span>
        </div>
      </section>
    </main>

    <script type="module" src="/assets/js/script.js"></script>
  </body>
</html>
